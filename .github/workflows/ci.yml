name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The runner tests include an end-to-end test of the plv binary.
      # Build plv first, or that test is skipped.
      - name: Build plv
        run: cargo build --locked --manifest-path validator/Cargo.toml
      - name: Run unittest suite
        run: python -m unittest tests.test_runner tests.test_sitl_up tests.test_m1_infrastructure tests.test_pilot_api tests.test_learn_cli tests.test_step_checks -v
        env:
          PLV: ${{ github.workspace }}/validator/target/debug/plv

  rust:
    name: Rust (validator, 1.75.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: validator
    env:
      # Minimum supported Rust version (docs/run-format-m1.md).
      RUST_TOOLCHAIN: "1.75.0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustc --version
      - name: Format check
        run: cargo fmt --check
      # Clippy runs without -D warnings: it could not run on the build
      # machine when this file was written. Add "-- -D warnings" after the
      # first green run (docs/ci.md).
      - name: Clippy
        run: cargo clippy --locked --all-targets
      - name: Tests
        run: cargo test --locked

  viewer:
    name: Viewer tests (Node 24 LTS)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.11.0"
      - name: Run node tests
        run: node --test viewer/tests/

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check tracked files
        run: bash .github/scripts/hygiene.sh
